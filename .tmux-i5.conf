# ═══════════════════════════════════════════════════════════════
# TMUX CONFIGURATION for carTest I5 wave execution
# Style: sfera-tender-bot (dark + accent)
# ═══════════════════════════════════════════════════════════════

# === BASIC SETTINGS ===
set -g default-terminal "screen-256color"
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g mouse on
set -g history-limit 10000
set -g display-time 2000
set -g status-interval 5

# === PREFIX KEY ===
# Keep default Ctrl-b

# === COLORS (carTest/vip-bike theme) ===
set -g status-style 'bg=#0F0F10,fg=#FFD700'      # Dark + gold
set -g pane-border-style 'fg=#3a3a3c'
set -g pane-active-border-style 'fg=#FFD700'
set -g window-status-current-format '#[fg=#0F0F10,bg=#FFD700,bold]#I:#W#[default]'

# === KEYBINDINGS ===
# Split panes (horizontal = - | vertical = |)
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

# New window with current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# === COPY MODE (vim-style) ===
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi r send -X rectangle-toggle

# === AUTO-START LAYOUT (3-pane dev setup) ===
# - Main: code/execution
# - Right top: tests/logs
# - Right bottom: shell/git
#
# Usage: tmux new -s i5-wave
#        Then press: Ctrl+b, then 3
bind 3 split-window -h -p 30 \; split-window -v -p 50

# === I5 WIDE SETUP (4-pane for parallel teammates) ===
# Usage: Ctrl+b, then 4
bind 4 split-window -h -p 25 \; split-window -v -p 50 \; select-pane -t 0 \; split-window -v -p 50

# ═══════════════════════════════════════════════════════════════
# QUICK START:
# 1. cp .tmux-i5.conf ~/.tmux.conf  (or source in-session)
# 2. tmux source-file ~/.tmux.conf
# 3. tmux new -s i5-wave
# 4. Ctrl+b, 3  (3-pane)  or  Ctrl+b, 4  (4-pane teammate mode)
# ═══════════════════════════════════════════════════════════════
